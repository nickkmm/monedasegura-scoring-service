[project]
name = "monedasegura-scoring-service"
version = "0.1.0"
description = "MonedaSegura scoring-service: fraud scoring and model training (FastAPI + LightGBM)"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.162.0",
    "uvicorn[standard]==0.54.0",
    "pydantic==2.14.1",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "httpx2==2.16.0",
    "ruff==0.17.2",
]

[tool.setuptools]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
